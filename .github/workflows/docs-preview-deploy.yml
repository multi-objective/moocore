name: Deploy docs preview

# Runs from the default branch with a write token. It only handles the static
# artifact built by the unprivileged Python/R workflows and never checks out
# or executes PR code.
on:
  workflow_run:
    workflows: [Python, R]
    types: [completed]

permissions: {}

jobs:
  deploy:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read # download artifact from the triggering run
    concurrency:
      group: gh-pages-deploy
      queue: max
      cancel-in-progress: false
    env:
      WORKFLOW: ${{ github.event.workflow_run.name }}
    steps:
      # The deploy action needs a git repository. This checks out the default
      # branch (workflow_run context), never the PR code.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select ${{ github.event.workflow_run.name }} docs
        id: docs
        run: |
          case "${WORKFLOW}" in
            Python) echo "sub=python" >> "$GITHUB_OUTPUT" ;;
            R)      echo "sub=r" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - uses: actions/download-artifact@v8
        with:
          name: docs-${{ steps.docs.outputs.sub }}
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The artifact contains a single folder named pr-<number> with the site.
      - name: Validate artifact
        id: pr
        run: |
          dir=$(ls artifact)
          [[ "$dir" =~ ^pr-([0-9]+)$ ]] || { echo "Invalid folder name"; exit 1; }
          [ -f "artifact/$dir/index.html" ] || { echo "Missing index.html"; exit 1; }
          if find "artifact/$dir" -type l | grep -q .; then echo "Symlinks not allowed"; exit 1; fi
          rm -rf "artifact/$dir/.git" "artifact/$dir/.github"
          echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Check PR ${{ steps.pr.outputs.number }} state
        id: pr-state
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setOutput('open', 'false');
              return;
            }
            const {data: pr} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('open', String(pr.state === 'open'));

      - name: Deploy PR ${{ steps.pr.outputs.number }} preview for ${{ steps.docs.outputs.sub }} 🚀
        if: steps.pr-state.outputs.open == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifact/pr-${{ steps.pr.outputs.number }}
          target-folder: previews/pr-${{ steps.pr.outputs.number }}/${{ steps.docs.outputs.sub }}
          single-commit: true
          clean: true

      - name: Comment PR ${{ steps.pr.outputs.number }} preview link for ${{ steps.docs.outputs.sub }} 📚
        if: steps.pr-state.outputs.open == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SUB: ${{ steps.docs.outputs.sub }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const sub = process.env.SUB;
            const label = process.env.WORKFLOW;
            const marker = `<!-- docs-preview-${sub}-marker -->`;
            const url = `https://multi-objective.github.io/moocore/previews/pr-${prNumber}/${sub}/`;
            const body = `${marker}\n📚 [**${label} docs preview** for this PR](${url})\n\n`;
            const {owner, repo} = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: prNumber});
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: prNumber, body});
            }
